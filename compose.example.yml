# Example: docker compose -f compose.example.yml up -d
# Update to the newest release: docker compose -f compose.example.yml pull && docker compose -f compose.example.yml up -d
services:
  picgen:
    image: ghcr.io/levoniust/picgen-bot:latest   # or pin a release, e.g. :1.0.0 (to build yourself: replace with "build: .")
    restart: unless-stopped
    user: "1000:1000"            # owner of ./data
    environment:
      PICGEN_DATA: /data
      PICGEN_TOKEN_FILE: /run/secrets/discord_token
      TZ: UTC
    volumes:
      - ./data:/data                                   # settings.json, jobs/, pictures/
      - ./discord_token:/run/secrets/discord_token:ro  # file containing only the bot token
